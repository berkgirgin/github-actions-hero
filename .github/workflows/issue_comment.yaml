name: Create a comment on new issues

on:
  issues:
    types: [opened]

jobs:
  comment-with-action:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: "dump github event"
        run: echo '${{ toJson(github.event) }}' | jq
        shell: bash
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            This is a multi-line test comment
            - With GitHub **Markdown** :sparkles:
            - Created by [create-or-update-comment][1]

            [1]: https://github.com/peter-evans/create-or-update-comment
          reactions: '+1'
      - name: "warning via console.log"
        if: always()
        run: node scripts/annotate.js warning log
      - name: "warning via console.warn"
        if: always()
        run: node scripts/annotate.js warning warn
      - name: "warning via console.error"
        if: always()
        run: node scripts/annotate.js warning error
      - name: "error via console.log"
        if: always()
        run: node scripts/annotate.js error log
      - name: "error via console.warn"
        if: always()
        run: node scripts/annotate.js error warn
      - name: "error via console.error"
        if: always()
        run: node scripts/annotate.js error error

  comment-with-api:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Create comment with API
        run: |
          gh api -X POST \
          /repos/${ORGANISATION}/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments \
          -f body='Comment, but from the API call, not action'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          ORGANISATION: ${{github.repository_owner}}
          REPOSITORY: ${{github.event.repository.name}}
          ISSUE_NUMBER: ${{github.event.issue.number}}
      - name: Annotate success
        if: success()
        run: node scripts/annotate.js success ${{ github.event.issue.number }} "API-Comment"
      - name: Annotate failure
        if: failure()
        run: node scripts/annotate.js failure ${{ github.event.issue.number }} "API-Comment"
